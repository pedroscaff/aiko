########################### About ##################################
about:
  enable: true
  image: 'images/aiko-about-me.webp'
  title: 'ABOUT ME'
  content: |
    Die deutsch-japanische Sängerin Aiko Bormann beeindruckt durch ihr vielseitiges Repertoire, dass von Kunstlied über Oper bis hin zu Oratorium reicht.
    Zu Beginn des Jahres 2026 gab sie ihr Solo-Debüt in der Philharmonie Berlin mit Beethovens 9. Sinfonie.

    Im März trat sie erstmals als Solistin in Irland in Karl Jenkins’ _Stabat Mater_ auf. Ein weiterer Höhepunkt der Saison 2026 wird ihr japanisches Solo-Debüt mit Beethovens 9. Sinfonie in Tokio im August sein.
    Im Februar 2025 sang sie im Rahmen der International Conducting Academy Berlin die Partie der Anna aus der Oper _Die sieben Todsünden_ von Kurt Weill in konzertanter Aufführung.

    Seit ihrem Abschluss an der Universität der Künste Berlin, legt Aiko Bormann den besonderen Schwerpunkt ihres künstlerischen Schaffens auf das Kunst lied.

    Bei Fragen und Kontaktanfrage kontaktieren Sie mich gerne [per E-Mail](mailto:kontakt@aikobormann.de)!
  moreContent: |
    Im Jahr 2023/2024 war sie Stipendiatin der Heidelberger Frühling Liedakademie und trat in diesem Rahmen bei der Schubert Woche im Pierre Boulez Saal in Berlin auf.
    2025 nahm sie an der renommierten Liedakademie LIEDBASEL in der Schweiz teil.
    Zuletzt wurde sie Preisträgerin des Art of Song Festival Maastricht 2026 (2. Preis).
    Im Juli 2026 wird Sie an der Akademie „Campus Lied et Melodie“ im Royaumont
    Campus nahe Paris mit Mentoren wie Barbara Hannigan und Bernada Fink
    teilnehmen.

    Aiko Bormanns Ausbildung wird durch zahlreiche Meisterkurse ergänzt, unter anderem bei Thomas Hampson, Susan Manoff, Charles Spencer und James Baillieu.

    Sie absolvierte ihr Bachelorstudium bei Prof. Albert Pesendorfer an der Universität
    der Künste Berlin und schloss ihren Master, ebenfalls an der UdK, bei Prof. Dr. Caitlin Hulcup ab.
    Während ihres Studiums sang Aiko Bormann u.a die Titelpartie der Vi in „Blue Monday“ von George Gershwin am UNI.T Theater der Universität der Künste im Jahr
    2023, die Partie der Pamina aus „Die Zauberflöte“ in der Akademie der Künste in
    Vera Nemirovas Inszenierung „Warten auf Mozart“ im Oktober 2022, sowie die Pamina im studentischen Musiktheaterkollektiv operationderkuenste in Berlin und
    Frankfurt am Main im April 2019.

    Neben solistischen Gesangsprojekten ist die Sängerin auch in verschiedenen Chorensembles aktiv und war zudem als Synchronsprecherin in dem Videospiel Cyberpunk
    zu hören.
  button:
    enable: true
    label: 'LEBENSLAUF HERUNTERLADEN'
